[support]
require_finite_planting_day = true
require_finite_maturity_day = true
require_positive_publisher_fraction = true
minimum_inclusive_season_months = 3
maximum_inclusive_season_months = 12

[author_domain]
countries = ["LKA", "VNM"]
season_label = "second"
expected_second_season_uids = 56
expected_second_season_uids_lka = 25
expected_second_season_uids_vnm = 31
expected_unique_hierarchy_parents = 43
expected_terminal_descendants = 147

[spatial]
grid_half_width_degrees = 0.25
area_crs = "EPSG:6933"
full_coverage_tolerance = 1e-6
require_exactly_one_selected_uid = true
competing_positive_area_allowed = false
partial_cell_assignment_allowed = false

[calendar_match]
plant_month_rule = "month containing source planting_day_of_year on a 365-day no-leap calendar"
harvest_month_rule = "month containing source maturity_day_of_year on a 365-day no-leap calendar"
season_length_rule = "inclusive cyclic count of calendar months from planting month through harvest month"
require_exact_plant_month = true
require_exact_harvest_month = true
require_exact_season_length = true
allow_distance_or_nearest_match = false

[promotion]
independent_product_definition = "GGCMI rice season identity ri1/ri2/ri3; irrigation branches are concordance checks, not extra independent products"
unique_exact_product_rule = "exactly one resident independent season product has at least one cell passing support, exact UID/full-cell spatial ownership, and all three exact author-calendar criteria, with its resident irrigation branches reported separately"
authoritative_crosswalk_required_for_authoritative_claim = true
weather_build_if_unique_product_passes = false

