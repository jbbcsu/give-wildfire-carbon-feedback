soil_moisture_family = "unavailable"
simultaneous_moisture_family_stacking_allowed = false
one_gdhy_outcome_per_cell_year = true
basis_before_irrigation_weighting_required = true

[next_gate]
name = "soybean_continuous_design_and_heterogeneity_preflight"
fit_outcome_response = false
purpose = "freeze and audit residualized design rank, overlap, leverage, country/block support, and feasible heterogeneity resolution before any response fit"
training_years = "1982-2010"
terminal_years = "2012-2016 retained as already-inspected predictive validation, not fresh causal validation"
required_fixed_effects = "cell first differences plus country-by-year or defensibly predeclared regional-year controls"
required_primary_moisture_family = "direct seasonal quantity"
required_comparison_families = ["direct distribution extension", "climatic water balance"]
required_nonstacking = true
required_heterogeneity_output = "support-qualified geographic response strata only; no economic winner/loser label"

