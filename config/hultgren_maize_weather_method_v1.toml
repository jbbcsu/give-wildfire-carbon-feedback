[code]
source_config = "config/hultgren_maize_response_source_v1.toml"
set_crop_variables = "data/raw/hultgren_response/3ccdffcd4e4ff6e55566ce76e2aac130ee86349a/set_crop_variables.do"
collapse_clim = "data/raw/hultgren_response/3ccdffcd4e4ff6e55566ce76e2aac130ee86349a/collapse_clim.do"
license_status = "No repository license file was located in the pinned source tree; retain copied source files in ignored raw data and do not redistribute them."

[maize]
growing_season_months = 10
precipitation_phase_lengths_months = [1, 3, 6]
precipitation_phases = ["month 1", "months 2-4", "months 5+"]
precipitation_polynomial_order = 2
gdd_lower_c = 8
kdd_threshold_c = 31
long_run_precipitation_spline_cap_mm = 250

[method]
raw_precipitation_time_step = "daily GMFD"
precipitation_aggregation = "Daily precipitation is summed to grid-cell month before polynomial transformation; transformed monthly terms are then aligned to fixed crop growing seasons and phase groups."
phase_selection = "Nested F-tests compare marginal precipitation effects at 100, 300, and 500 mm, proceeding from each end of the season; p < 0.05 creates a phase break, with visual resolution when forward and reverse searches disagree."
final_selection = "The second cross-validation step selects phased versus total-season precipitation; maize retains phased precipitation."
drought_candidate = "A binary drought candidate uses a crop-specific percentile cutoff of administrative-unit total growing-season precipitation selected by 10-fold cross-validation; it is not part of the published final maize specification."
extreme_rain_candidate = "Amount and day-count candidates above the grid-cell 1980-2010 daily precipitation 95th percentile were evaluated but are not part of the published final maize specification."

[reproducibility]
published_estimate_available = true
full_covariance_available = true
required_regression_dataset_available = false
exact_historical_response_reproduction_ready = false
future_projection_ready = false
damage_ready = false
scc_ready = false

[validation]
required_supplement_text = [
  "Precipitation is a grid-cell by month measure",
  "summed within month before polynomial transformations were performed",
  "Growing Phase Precipitation",
  "Maize 1 2-4 5+",
  "prcp phase[P ]it represents monthly precipitation summed within growing-season-phase P",
]

required_code_text = [
  "global months = 10",
  "mat prcp_mat = [1,3,6]",
  "global precip_poly = 2",
  "global base = 8",
  "global cutoff = 31",
  "global lastbincut_prcp = 250",
]
