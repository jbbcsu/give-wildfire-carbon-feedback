candidate_model_id = "scpdsi_stage_means"
reference_model_id = "controls_only"

[[comparisons]]
id = "scpdsi_mean_minus_direct_quantity"
candidate_model_id = "scpdsi_mean"
reference_model_id = "direct_quantity"

[[comparisons]]
id = "scpdsi_seasonal_summary_minus_direct_quantity"
candidate_model_id = "scpdsi_seasonal_summary"
reference_model_id = "direct_quantity"

[[comparisons]]
id = "scpdsi_stage_means_minus_direct_quantity"
candidate_model_id = "scpdsi_stage_means"
reference_model_id = "direct_quantity"
