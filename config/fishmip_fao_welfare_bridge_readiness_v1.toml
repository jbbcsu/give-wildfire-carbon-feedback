[[external_data_request.components]]
id = "matched_marginal_biophysical_counterfactual"
purpose = "Replace SSP contrasts with same-realization baseline and one-ton-CO2-pulse harvest or availability paths."
required_keys = ["draw_id", "climate_model", "ecosystem_model", "management_scenario", "year", "grid_cell_or_stock_id", "commodity_id"]
required_variables = ["baseline_harvest_or_availability", "pulse_harvest_or_availability", "unit", "coverage_status"]
requirements = ["global declared support", "identical baseline/pulse masks", "stock or market-commodity identity", "no scenario contrast substituted for pulse"]

[[external_data_request.components]]
id = "spatial_and_market_incidence"
purpose = "Map modeled supply to harvest rights, producers, landings, trade, and consumers without equating EEZ location with incidence."
required_keys = ["grid_cell_or_stock_id", "year", "producer_country_iso3", "consumer_country_iso3"]
required_variables = ["harvest_fraction", "landing_fraction", "trade_or_consumption_fraction", "high_seas_flag", "joint_or_disputed_flag", "coverage_status"]
requirements = ["licensed checksum-pinned geometry", "fractions conserve within declared support", "high seas and disputed waters remain explicit", "no missing allocation treated as zero"]

[[external_data_request.components]]
id = "direct_market_welfare"
purpose = "Identify consumer and producer surplus rather than revenue or multiplied output."
required_keys = ["commodity_id", "country_iso3", "year", "management_scenario"]
required_variables = ["baseline_price", "baseline_quantity", "demand_parameter_or_elasticity", "supply_or_cost_parameter", "currency_price_year", "coverage_status"]
requirements = ["consumer surplus reported separately", "producer surplus reported separately", "management and effort response explicit", "trade closure explicit", "no indirect or induced output multiplier"]

[[external_data_request.components]]
id = "overlap_and_substitution_boundary"
purpose = "Prevent overlap with GIVE agriculture, mortality, CIAM, and excluded ocean services."
required_keys = ["accounting_boundary_id"]
required_variables = ["aquaculture_treatment", "terrestrial_food_substitution_treatment", "nutrition_mortality_treatment", "ciam_exclusion", "coral_and_biodiversity_exclusion"]
requirements = ["nutrition excluded unless incremental causes and deaths are reconciled", "terrestrial food feedback excluded or jointly modeled", "gross revenue excluded as welfare"]

[[external_data_request.components]]
id = "provenance_and_missingness"
purpose = "Make every bridge input independently auditable and distributable."
required_keys = ["source_id", "version"]
required_variables = ["license", "source_url_or_doi", "sha256_or_sha512", "coverage_definition", "missing_zero_suppressed_codes"]
requirements = ["redistribution permission explicit", "raw and derived hashes pinned", "no imputation or renormalization before registered review"]

[forbidden_shortcuts]
global_tc_times_single_price = true
fixed_fao_country_or_species_shares = true
eez_location_equals_producer_or_consumer_incidence = true
historical_fit_probability_weights = true
gross_revenue_equals_welfare = true
blue_scc_coefficient_transfer = true
ssp_difference_equals_marginal_co2_pulse = true

[claim_gates]
globally_complete_welfare_ready_biophysical_response = false
fishmip_to_fao_commodity_bridge_identified = false
country_incidence_identified = false
consumer_surplus_identified = false
producer_surplus_identified = false
overlap_resolved = false
matched_co2_pulse_available = false
damage_or_scc_authorized = false
