[evaluation]
split = "leave_one_whole_scenario_out"
model = "training_cell_mean_plus_common_within_cell_gmst_slope"
benchmark = "training_cell_mean"
support_rule = "for_each_held_out_scenario_cell_feature_flag_below_within_or_above_the_exact_two_scenario_training_minimum_and_maximum"

[limitations]
complete_three_scenario_endcentury_matrix = true
whole_scenario_holdouts = true
whole_esm_holdouts = false
fair_baseline_pulse_feature_support = false
paired_baseline_pulse_paths = false
response_estimation_authorized = false
damage_or_scc_authorized = false
