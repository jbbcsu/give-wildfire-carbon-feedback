schema = "isimip3b_mpi_three_scenario_endcentury_holdout_config_v1"
role = "outcome_blind_joined_mpi_three_scenario_endcentury_feature_holdout_and_support_audit_not_emulator_damage_or_scc"
registered_utc_date = "2026-09-01"

[selection]
esm_id = "MPI-ESM1-2-HR"
member_id = "r1i1p1f1"
crop = "mai"
irrigation = "noirr"
latitude_indices = "100:102"
year_start = 2092
year_end = 2099
expected_scenarios = ["ssp126", "ssp370", "ssp585"]
expected_feature_families = ["tmean_c", "precip_mm", "wet_days_n", "cdd_max_days", "rx1day_mm", "rx5day_mm", "stage1_precip_share", "stage2_precip_share", "stage3_precip_share", "precipitation_timing_centroid", "precipitation_concentration_hhi"]

[[cells]]
scenario = "ssp126"
season_path = "data/interim/isimip3b_mpi_ssp126_2091_2100_smoke/mai_noirr_2092_2099_lat100_102_features.parquet"
stage_path = "data/interim/isimip3b_mpi_ssp126_2091_2100_smoke/mai_noirr_2092_2099_lat100_102_stages.parquet"
gmst_path = "data/interim/isimip3b/mpi-esm1-2-hr_r1i1p1f1_ssp126_gmst_2091_2100.parquet"

[[cells]]
scenario = "ssp370"
season_path = "data/interim/isimip3b_mpi_ssp370_2091_2100_smoke/mai_noirr_2092_2099_lat100_102_features.parquet"
stage_path = "data/interim/isimip3b_mpi_ssp370_2091_2100_smoke/mai_noirr_2092_2099_lat100_102_stages.parquet"
gmst_path = "data/interim/isimip3b/mpi-esm1-2-hr_r1i1p1f1_ssp370_gmst_2091_2100.parquet"

[[cells]]
scenario = "ssp585"
season_path = "data/interim/isimip3b_mpi_ssp585_2091_2100_smoke/mai_noirr_2092_2099_lat100_102_features.parquet"
stage_path = "data/interim/isimip3b_mpi_ssp585_2091_2100_smoke/mai_noirr_2092_2099_lat100_102_stages.parquet"
