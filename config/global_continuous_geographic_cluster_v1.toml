protocol_path = "GLOBAL_CONTINUOUS_GEOGRAPHIC_CLUSTER_PROTOCOL_20260907.md"

[support]
key_fields = ["crop", "lat", "lon_360", "harvest_year"]
families = ["direct", "heat", "scpdsi"]
exact_inner_join = true
positive_identical_outcomes_required = true
finite_registered_features_required = true
consecutive_year_differences_only = true
train_end_years = [1983, 2010]
excluded_end_year = 2011
test_end_years = [2012, 2016]

[geographic_folds]
count = 5
latitude_block_degrees = 10
longitude_block_degrees = 10
assignment = "(37*floor((lat+90)/10)+17*floor(lon_360/10)+20260907)%5"
outcome_blind = true
held_out_blocks_absent_from_training = true
minimum_blocks_per_fold = 2
minimum_blocks_per_crop = 10

[models]
ordered_names = ["controls_only", "quantity", "quantity_distribution", "scpdsi_mean", "scpdsi_stages"]
moisture_families_mutually_exclusive = true
condition_number_maximum = 1.0e10
coefficient_export_forbidden = true
row_prediction_export_forbidden = true

[uncertainty]
cluster = "crop_specific_10_degree_latitude_longitude_source_block"
resampling = "paired_within_fold_cluster_bootstrap"
replicates = 5000
generator = "numpy.random.Generator(PCG64)"
seed = 20260907
quantiles = [0.025, 0.5, 0.975]
contrasts = ["quantity_minus_controls_only", "quantity_distribution_minus_quantity", "scpdsi_mean_minus_quantity", "scpdsi_stages_minus_quantity"]
retain_all_pairs_within_selected_cluster = true
conditional_on_fixed_fits = true
significance_claim_forbidden = true

[resources]
existing_derived_inputs_only = true
download_forbidden = true
raw_rehydration_forbidden = true
one_parquet_file_at_a_time = true
batch_rows = 8192
latitude_block_degrees = 10
sampled_peak_resident_memory_bytes_maximum = 1073741824
result_bytes_maximum = 1048576
large_climate_computation_forbidden = true

[decision]
coefficient_export_authorized = false
model_promotion_authorized = false
causal_response_authorized = false
future_projection_authorized = false
fair_run_authorized = false
damage_or_welfare_authorized = false
scc_authorized = false
all_results_remain_exploratory = true

