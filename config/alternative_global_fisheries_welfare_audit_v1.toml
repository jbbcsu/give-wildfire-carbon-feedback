[[candidates]]
id = "free_gaines_climate_linked_bioeconomic_model"
title = "Realistic fisheries management reforms could mitigate the impacts of climate change in most countries"
primary_source = "https://doi.org/10.1371/journal.pone.0224347"
official_repository = "https://github.com/SFG-UCSB/cc_trade"
license_access = "Paper is CC BY; repository is public but has no root LICENSE/COPYING file at the pinned commit, and the two raw inputs named by Step1 are absent. Derived country CSVs and R scripts are present."
geographic_coverage = "156 coastal sovereign countries, 779 single-species stocks, and 58.2% of reported 2012 global catch; released CSVs also contain ABNJ, Antarctica, and joint-area labels. Broad but explicitly incomplete."
response_semantics = "RCP scenario projections of species distribution, carrying capacity, biomass, catch, and profit under management adaptations; not a marginal emissions pulse."
welfare_semantics = "Profit equals revenue minus fishing cost in the paper. Neither consumer surplus nor an output explicitly identified as producer surplus appears in the released source."
pulse_compatibility = "RCP pathways and management contrasts are not a same-realization baseline versus one-ton-CO2 pulse pair."
overlap_risks = "Profit must not be added to output-multiplier damages; country allocation assumes biomass, catch, and profit are uniform over modeled species range; aquaculture, nutrition/mortality, terrestrial-food substitution, and trade incidence remain outside the model."
