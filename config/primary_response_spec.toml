[[production_feature_requirements]]
id = "temperature_precipitation_interactions"
estimand_role = "joint heat-water response and attribution consistency"
construction_outputs = ["tmean_x_log1p_precip", "stage1_tmean_x_log1p_precip", "stage2_tmean_x_log1p_precip", "stage3_tmean_x_log1p_precip"]
candidate_model_terms = ["mean-temperature by precipitation-quantity interaction", "pre-registered hot-dry and wet-heat interactions"]
required_for_production_comparison = true
current_status = "seasonal and stage mean-temperature by log-precipitation terms constructed before irrigation weighting; compound heat-pattern forms unresolved"
model_form_status = "not_frozen"
diagnostic_coverage = "covered"
diagnostic_present_features = ["tmean_x_log1p_precip", "stage1_tmean_x_log1p_precip", "stage2_tmean_x_log1p_precip", "stage3_tmean_x_log1p_precip"]
diagnostic_absent_features = []
literature_basis = ["joint model required to separate correlated climate drivers"]

[threshold_registry]
production_wet_day_thresholds_mm = []
production_heat_thresholds_c = []
production_drought_thresholds = []
status = "not_frozen"
rule = "register crop/specification definitions from primary literature or a documented training-only procedure before production outcome estimation; diagnostic defaults and QA thresholds are not selections"

[[water_stress_families]]
id = "direct_precipitation_pattern"
role = "candidate family with seasonal precipitation quantity as its parsimonious reference"
members = ["seasonal and stage amount", "normalized timing/distribution", "wet-day occurrence and intensity", "CDD", "Rx1day", "Rx5day"]
projection_status = "historical candidate basis builder implemented; matched future paired basis incomplete"
production_use_authorized = false
exclusive_group = "water_stress_representation"

[[water_stress_families]]
id = "climatic_water_balance"
role = "serious competing predictive and robustness family"
members = ["SPEI", "self-calibrated PDSI where defensible"]
projection_status = "historical 1982-1989 and 2012-2016 aggregate-regime scPDSI candidate panels implemented with raw-source/calendar manifest binding and complete derived-input allocation recomputation for maize/soybean; response fit and matched future SPEI/PDSI path absent"
production_use_authorized = false
exclusive_group = "water_stress_representation"

[[water_stress_families]]
id = "soil_moisture"
role = "competing physical-mediator robustness family"
members = ["root-zone soil-moisture anomaly", "antecedent and stage soil moisture"]
projection_status = "input and matched future path absent"
production_use_authorized = false
exclusive_group = "water_stress_representation"

[water_stress_comparison]
required_families = ["direct_precipitation_pattern", "climatic_water_balance", "soil_moisture"]
simultaneous_stacking_allowed = false
selection_status = "not_frozen"
rule = "evaluate families separately under common outer holdouts; allow PDSI/scPDSI or SPEI to outperform and replace direct precipitation terms; do not select by SCC magnitude and do not sum their damages"

[irrigation_exposure]
approach = "one area-weighted exposure per observed GDHY crop-grid-year yield"
weights = "independent fixed-baseline crop-grid rainfed and irrigated harvested-area shares"
forbidden = "do not duplicate one GDHY yield across irrigation regimes or label an aggregate outcome rainfed"
aggregate_estimand_contract = "config/irrigation_aggregate_estimand.toml"
basis_allocation_order = "construct every nonlinear basis and interaction within regime before fixed-area weighting"
post_aggregation_nonlinear_transform_allowed = false
production_basis_status = "not frozen; minimal diagnostic basis and 54-column direct-pattern candidate allocation contracts are executable, but thresholds, heat/drought alternatives, model form, and causal estimator remain open"
production_source_status = "MIRCA-OS v2 archive acquired and checksum/grid validated; exact maize/soybean weights built for all five vintages; rice/wheat season mapping remains blocked"
production_source_id = "MIRCA-OS_v2_March_2026_AHAG_30arcmin"
primary_share_year = 2000
sensitivity_share_years = [2005, 2010, 2015, 2020]
share_year_rule = "one declared vintage fixed across every historical outcome year"
production_eligible_outcome_crops = ["mai", "soy"]
season_mapping_gate = "ri1, ri2, swh, and wwh remain blocked because annual parent-crop maps do not identify the GDHY season"

[fixed_effects]
outcome_cell = "lat_lon_crop_season"
irrigation_dimension_rule = "not an outcome fixed-effect dimension; aggregate rainfed and irrigated response-basis terms to the single observed crop-season-grid-year outcome under the separate irrigation estimand contract"
time_shock_candidates = ["harvest-year fixed effects", "crop-by-year fixed effects", "first-difference design with registered common or region-specific year-shock controls"]
first_difference_vs_level_fixed_effects_status = "not_frozen"
spatial_inference_status = "not_frozen"
production_identification_status = "not_frozen"

[validation_boundary]
current_spatial_split_status = "grid-block split is observation-disjoint across held-out cells"
legacy_reported_temporal_extreme_split_status = "adjacent first-difference pairs could share one level-yield endpoint across train and test"
current_temporal_extreme_split_status = "current hashed diagnostic evaluator purges training pairs sharing either yield endpoint with temporal or extreme tests"
current_temporal_extreme_interpretation = "endpoint-disjoint predictive diagnostic only; still noncausal and SCC-ineligible"
production_requires_purged_observation_disjoint_temporal_extreme_splits = true
production_split_implementation_status = "implemented_and_synthetic_tests_pass"
real_panel_rerun_status = "maize_soy_1982_1989_and_2012_2016_mirca2000_direct_diagnostics_passed_historical_1982_1989_and_2012_2016_scpdsi_candidate_data_passed_but_unfitted_other_panels_pending"
forbidden = "do not report legacy temporal or extreme performance as current or generalize the partial current-hash rerun; every promoted panel must audit that each level-yield observation contributing to a test difference is absent from training"

[integration_boundary]
current_component = "src/CropResponseAggregation.jl"
current_status = "linear plumbing and accounting harness only"
production_eligible = false
required_choice = "either expand the Mimi interface to the complete frozen response basis or pass precomputed crop-region-year loss draws with an auditable one-to-one mapping"
forbidden = "do not compress omitted timing, frequency, intensity, Rx5day, heat, interactions, or competing drought responses into undocumented aggregate slots"

[decision]
approved_by = "project owner"
approved_on = "2026-08-25"
approved_scope = "global SCC estimand, MooreAg replacement, fixed/trend/upper adaptation reporting, and fixed-baseline irrigation weighting defaults"
excluded_scope = "production causal functional form, empirical thresholds, drought-family selection, and final integration representation"
status = "recommended defaults approved within the stated scope"

[boundary]
status = "production candidate registry is not frozen; full global aggregate-regime crop-stage estimation and validation remain required for inference and SCC inputs"
