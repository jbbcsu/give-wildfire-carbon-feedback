[outcome]
name = "log_yield_t_ha"
source = "GDHY v1.2/v1.3"

[features]
continuous = ["tmean_c", "log1p_precip_mm", "cdd_max_days", "rx1day_mm"]
interaction = "tmean_c_x_log1p_precip_mm"
primary_precipitation_family = "seasonal total plus within-season distribution, wet-day frequency, consecutive dry days, Rx1day, and Rx5day"
primary_water_stress = "direct precipitation-pattern and dry-spell features"
robustness_water_stress = ["PDSI_or_SPEI_like", "soil_moisture"]
water_stress_combination_rule = "estimate alternatives separately; never stack competing drought representations"
heat_threshold_rule = "crop-specific thresholds registered from literature before outcome estimation"

[irrigation_exposure]
approach = "one area-weighted exposure per observed GDHY crop-grid-year yield"
weights = "independent fixed-baseline crop-grid rainfed and irrigated harvested-area shares"
forbidden = "do not duplicate one GDHY yield across irrigation regimes or label an aggregate outcome rainfed"
production_source_status = "MIRCA-OS v2 archive acquired and checksum/grid validated; exact maize/soybean weights built for all five vintages; rice/wheat season mapping remains blocked"
production_source_id = "MIRCA-OS_v2_March_2026_AHAG_30arcmin"
primary_share_year = 2000
sensitivity_share_years = [2005, 2010, 2015, 2020]
share_year_rule = "one declared vintage fixed across every historical outcome year"
production_eligible_outcome_crops = ["mai", "soy"]
season_mapping_gate = "ri1, ri2, swh, and wwh remain blocked because annual parent-crop maps do not identify the GDHY season"

[decision]
approved_by = "project owner"
approved_on = "2026-08-25"
status = "recommended defaults approved"

[fixed_effects]
grid = "lat_lon_crop_irrigation"
year = "harvest_year"

[boundary]
status = "primary feature and irrigation rules approved; full global crop-stage estimation remains required for inference and SCC inputs"
