schema_version = 2
specification_id = "global_joint_agriculture_production_candidate_registry"
specification_kind = "production causal-model design registry"
freeze_status = "not_frozen"
fit_authorized = false
response_draw_export_authorized = false
scc_use_authorized = false

[outcome]
name = "log_yield_t_ha"
source = "GDHY v1.2/v1.3"

[estimand]
primary = "joint crop-yield response to matched temperature and precipitation-pattern climate paths"
precipitation_quantity_contrast = "change seasonal precipitation quantity while holding a declared normalized within-season pattern fixed"
precipitation_distribution_contrast = "change stage timing/distribution, wet-day occurrence/intensity, dry spells, and wet extremes while holding seasonal precipitation quantity fixed"
quantity_scope = "crop-calendar growing-season total is primary; calendar-year total is a benchmark or sensitivity and cannot replace stage-aligned exposure"
joint_effect_rule = "report the full matched joint-climate prediction as primary"
precipitation_attribution_rule = "declare a symmetric counterfactual decomposition before estimation; label it accounting attribution rather than a uniquely identified causal effect"
causal_status = "not established; production functional form, identifying assumptions, and inference remain to be frozen and validated"

[model_hierarchy]
primary_selection_status = "not_frozen"
parsimonious_reference = "joint temperature and crop-calendar growing-season precipitation quantity"
distribution_status = "candidate incremental feature family; not privileged"
distribution_retention_rule = "retain timing, concentration, occurrence, intensity, dry-spell, or wet-extreme terms only where pre-specified outer out-of-sample tests show robust and stable incremental value beyond the seasonal-quantity reference"
null_and_adverse_result_rule = "report null, unstable, and worse held-out performance plainly; permit the parsimonious seasonal-quantity specification to be primary"
drought_family_status = "PDSI/scPDSI and SPEI are serious competing moisture-stress representations evaluated under the same outer holdouts"
nonstacking_rule = "direct precipitation-pattern, climatic-water-balance, and soil-moisture families replace one another unless a separately pre-specified attribution design proves nonoverlap"
selection_target = "scientific validity, stability, parsimony, and external validation; never SCC magnitude"

[diagnostic_boundary]
frozen_predictive_spec = "config/response_evaluation_spec.toml"
relationship = "deliberately minimal predictive diagnostic subset of this production candidate registry"
frozen_predictive_spec_is_production_eligible = false
promotion_rule = "a diagnostic model or ranking cannot become the production response without a separately frozen production specification covering every required comparison, identifying assumptions, uncertainty, and external validation"
forbidden = "do not treat the diagnostic feature list, coefficients, rankings, or configuration hash as the production causal model or an SCC response source"

[[production_feature_requirements]]
id = "seasonal_precipitation_quantity"
estimand_role = "seasonal amount benchmark and quantity contrast"
construction_outputs = ["precip_mm"]
candidate_model_terms = ["precip_mm", "log1p_precip_mm", "nonlinear seasonal-amount response"]
required_for_production_comparison = true
current_status = "constructed"
model_form_status = "not_frozen"
diagnostic_coverage = "covered"
diagnostic_present_features = ["log1p_precip_mm"]
diagnostic_absent_features = []
literature_basis = ["Fishman_2016", "Guan_et_al_2015"]

[[production_feature_requirements]]
id = "stage_precipitation_quantity"
estimand_role = "crop-window amount heterogeneity"
construction_outputs = ["stage1_precip_mm", "stage2_precip_mm", "stage3_precip_mm"]
candidate_model_terms = ["stage-specific precipitation totals or transformations"]
required_for_production_comparison = true
current_status = "constructed for transparent three-window proxies; crop-specific phenological stages unresolved"
model_form_status = "not_frozen"
diagnostic_coverage = "covered"
diagnostic_present_features = ["stage1_log1p_precip_mm", "stage2_log1p_precip_mm", "stage3_log1p_precip_mm"]
diagnostic_absent_features = []
literature_basis = ["Marcos_Garcia_et_al_2024", "Xia_et_al_2021"]

[[production_feature_requirements]]
id = "normalized_stage_distribution_and_timing"
estimand_role = "within-season distribution conditional on seasonal amount"
construction_outputs = ["stage1_precip_share", "stage2_precip_share", "stage3_precip_share", "precipitation_timing_centroid", "precipitation_concentration_hhi", "zero_precipitation_season"]
candidate_model_terms = ["composition-aware stage shares", "timing centroid", "concentration"]
required_for_production_comparison = true
current_status = "basis-before-irrigation-weighting candidate construction implemented; composition parameterization and phenological stages unresolved"
model_form_status = "not_frozen"
diagnostic_coverage = "partial"
diagnostic_present_features = ["stage1_log1p_precip_mm", "stage2_log1p_precip_mm", "stage3_log1p_precip_mm"]
diagnostic_absent_features = ["stage1_precip_share", "stage2_precip_share", "stage3_precip_share", "precipitation_timing_centroid", "precipitation_concentration_hhi"]
literature_basis = ["Fishman_2016", "Marcos_Garcia_et_al_2024", "Guan_et_al_2015"]

[[production_feature_requirements]]
id = "wet_day_frequency"
estimand_role = "rainfall occurrence conditional on amount"
construction_outputs = ["wet_days_n", "stage1_wet_days_n", "stage2_wet_days_n", "stage3_wet_days_n", "wet_day_frequency"]
candidate_model_terms = ["wet-day count", "wet-day fraction"]
required_for_production_comparison = true
current_status = "seasonal and stage candidate construction implemented before irrigation weighting; production wet-day definition is not frozen"
model_form_status = "not_frozen"
diagnostic_coverage = "omitted"
diagnostic_present_features = []
diagnostic_absent_features = ["wet_days_n", "stage1_wet_days_n", "stage2_wet_days_n", "stage3_wet_days_n", "wet_day_frequency"]
literature_basis = ["Fishman_2016", "Kemsley_et_al_2024"]

[[production_feature_requirements]]
id = "wet_day_intensity"
estimand_role = "conditional rainfall intensity distinct from amount and occurrence"
construction_outputs = ["mean_wet_day_intensity_mm"]
candidate_model_terms = ["seasonal and stage conditional wet-day intensity"]
required_for_production_comparison = true
current_status = "seasonal and stage candidate construction implemented before irrigation weighting; production wet-day definition is not frozen"
model_form_status = "not_frozen"
diagnostic_coverage = "omitted"
diagnostic_present_features = []
diagnostic_absent_features = ["mean_wet_day_intensity_mm"]
literature_basis = ["Fishman_2016", "Lesk_et_al_2020", "Guan_et_al_2015"]

[[production_feature_requirements]]
id = "consecutive_dry_days"
estimand_role = "seasonal and crop-window dry-spell persistence"
construction_outputs = ["cdd_max_days", "stage1_cdd_max_days", "stage2_cdd_max_days", "stage3_cdd_max_days"]
candidate_model_terms = ["maximum consecutive dry days", "nonlinear or tail response"]
required_for_production_comparison = true
current_status = "seasonal and stage candidate construction implemented before irrigation weighting; production wet/dry threshold and functional form are not frozen"
model_form_status = "not_frozen"
diagnostic_coverage = "covered"
diagnostic_present_features = ["cdd_max_days", "stage1_cdd_max_days", "stage2_cdd_max_days", "stage3_cdd_max_days"]
diagnostic_absent_features = []
literature_basis = ["Troy_et_al_2015", "Marcos_Garcia_et_al_2024"]

[[production_feature_requirements]]
id = "rx1day_wet_extreme"
estimand_role = "single-day heavy-rain and excess-water exposure"
construction_outputs = ["rx1day_mm", "stage1_rx1day_mm", "stage2_rx1day_mm", "stage3_rx1day_mm"]
candidate_model_terms = ["Rx1day", "nonlinear or tail response"]
required_for_production_comparison = true
current_status = "seasonal and stage candidate construction implemented before irrigation weighting; response form is not frozen"
model_form_status = "not_frozen"
diagnostic_coverage = "covered"
diagnostic_present_features = ["rx1day_mm", "stage1_rx1day_mm", "stage2_rx1day_mm", "stage3_rx1day_mm"]
diagnostic_absent_features = []
literature_basis = ["Li_et_al_2019", "Lesk_et_al_2020"]

[[production_feature_requirements]]
id = "rx5day_wet_extreme"
estimand_role = "multi-day heavy-rain and excess-water exposure"
construction_outputs = ["rx5day_mm", "stage1_rx5day_mm", "stage2_rx5day_mm", "stage3_rx5day_mm"]
candidate_model_terms = ["Rx5day", "nonlinear or tail response"]
required_for_production_comparison = true
current_status = "seasonal and stage candidate construction implemented before irrigation weighting; response form is not frozen"
model_form_status = "not_frozen"
diagnostic_coverage = "omitted"
diagnostic_present_features = []
diagnostic_absent_features = ["rx5day_mm", "stage1_rx5day_mm", "stage2_rx5day_mm", "stage3_rx5day_mm"]
literature_basis = ["Troy_et_al_2015", "IPCC_AR6_WGI_Chapter_11"]

[[production_feature_requirements]]
id = "mean_temperature"
estimand_role = "joint climate driver and confounder control"
construction_outputs = ["tmean_c", "stage1_tmean_c", "stage2_tmean_c", "stage3_tmean_c"]
candidate_model_terms = ["crop-window temperature response"]
required_for_production_comparison = true
current_status = "constructed; nonlinear form is not frozen"
model_form_status = "not_frozen"
diagnostic_coverage = "covered"
diagnostic_present_features = ["tmean_c", "stage1_tmean_c", "stage2_tmean_c", "stage3_tmean_c"]
diagnostic_absent_features = []
literature_basis = ["Carleton_et_al_2025", "Ortiz_Bobea_et_al_2021"]

[[production_feature_requirements]]
id = "heat_extremes"
estimand_role = "crop-specific exposure to damaging daily maximum temperature"
construction_outputs = ["threshold-specific hot-day counts", "threshold-specific degree-day excess", "stage-resolved counterparts"]
candidate_model_terms = ["crop-specific literature-registered thresholds", "threshold uncertainty"]
required_for_production_comparison = true
current_status = "builder and algebraic validation implemented; no production crop thresholds selected"
model_form_status = "not_frozen"
diagnostic_coverage = "omitted"
diagnostic_present_features = []
diagnostic_absent_features = ["heat_threshold_days", "heat_threshold_degree_days"]
