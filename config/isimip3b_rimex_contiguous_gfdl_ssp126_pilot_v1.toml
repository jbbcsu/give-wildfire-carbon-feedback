schema = "isimip3b_rimex_contiguous_pilot_contract_v1"
role = "outcome_blind_contiguous_daily_support_pilot_not_feature_response_damage_or_scc_input"
registered_utc_date = "2026-09-02"
primary_climate_route = "direct_isimip3b_daily_feature_response"
fallback_climate_route = "mesmer_m_tp_plus_published_daily_generator"

[source]
catalogue_api = "https://data.isimip.org/api/v1/datasets/"
resource_doi = "10.48364/ISIMIP.842396.1"
dataset_version = "20210512"
rights = "CC0 1.0"

[[datasets]]
variable = "pr"
dataset_id = "24cb1007-3c96-4b59-a0dc-42d94a8cff8c"

[[datasets]]
variable = "tas"
dataset_id = "f741da2d-9d21-4c86-be9b-484396303e33"

[selection]
esm_id = "gfdl-esm4"
member_id = "r1i1p1f1"
scenario = "ssp126"
variables = ["pr", "tas"]
file_periods = ["2031_2040", "2041_2050", "2051_2060"]
daily_support_start_year = 2031
daily_support_end_year = 2060
crop_feature_start_year = 2032
crop_feature_end_year = 2059
running_mean_years = 21
smoothed_feature_start_year = 2042
smoothed_feature_end_year = 2049
crop = "mai"
irrigation = "noirr"
latitude_index_start = 100
latitude_index_stop_exclusive = 102

[design]
rule = "Pin one ESM member and one low-forcing scenario before acquisition; add the two daily decades bracketing the already validated 2041-2050 pair."
rationale = "Daily support from 2031 through 2060 yields crop-feature years 2032-2059 and exactly eight centered 21-year running-mean outputs for 2042-2049 without treating gaps as adjacent."
expected_dataset_count = 2
expected_file_count = 6
expected_daily_support_years = 30
expected_crop_feature_years = 28
expected_smoothed_feature_years = 8
whole_esm_or_scenario_promotion_allowed_from_pilot = false

[required_gates]
metadata = "Exact dataset/file UUID, version, byte size, SHA-512, public/unrestricted/CC0 status, forcing, member, scenario, variable, and decade."
content = "Full checksum, decoded global grid, units, physical bounds, missingness, exact daily chronology, and paired pr/tas calendar identity."
features = "Same-realization annual GMST plus exact crop-year quantity, timing, wet-day, dry-spell, extreme-rain, heat, and stage/season reconciliation."
smoothing = "Centered 21-year means may be emitted only for years with ten real consecutive feature years on each side; no cross-gap adjacency or endpoint padding."
holdouts = "Pilot mechanics do not replace complete whole-ESM and whole-scenario validation."
pairing = "Any later FAIR evaluation retains common random numbers, separate support flags, zero-pulse/pre-divergence identity, and at least three decreasing positive pulse sizes."

[limitations]
metadata_pinned = false
all_six_files_acquired = false
all_six_files_content_validated = false
contiguous_features_built = false
joint_dependence_preserved = false
real_rimex_fit_authorized = false
fair_feature_response_authorized = false
production_emulator_authorized = false
damage_or_scc_authorized = false
