[published_method]
name = "RIME-X"
article_version = "v1.0"
article_doi = "10.5194/gmd-19-6797-2026"
article_publication_date = "2026-07-30"
software_version = "1.0.0"
software_concept_doi = "10.5281/zenodo.17491734"
software_exact_archive_doi = "10.5281/zenodo.21061984"
reviewed_repository_url = "https://github.com/iiasa/rimeX"
