schema_version = 1
contract_id = "us_competing_moisture_paired_loss_uncertainty_v1"
description = "Separate conditional paired predictive-loss sensitivity for the independently validated U.S. county competing-moisture diagnostic."
base_protocol_id = "us_corn_soy_competing_moisture_predictive_v1"

score_basis = "registered_endpoint_purged_fits_recomputed_in_memory_on_identical_test_support"
development_pooling = "pool_each_eligible_leave_state_out_test_row_once_using_its_state_holdout_fit"
resampling_scheme = "paired_fixed_fit_county_cluster_bootstrap"
resampling_unit = "whole_county_across_all_relevant_test_rows_within_crop_practice_report_scope"
bootstrap_replicates = 5000
random_seed = 20260826
seed_derivation = "base_seed_plus_zero_based_report_index_in_locked_crop_practice_scope_state_order"
interval_probabilities = [0.025, 0.975]
minimum_occupied_counties_per_report = 30
maximum_county_test_row_share = 0.10
state_specific_scope = "development_leave_state_out_distribution_vs_quantity_only_when_at_least_30_test_counties"
observation_weighting = "equal_test_row_weighting_with_counties_resampled_uniformly"
training_refit_within_bootstrap = false
model_selection_rule = "none_sensitivity_does_not_revise_or_reapply_the_frozen_distribution_promotion_rule"

post_hoc_support_sensitivity_authorized = true
post_hoc_excluded_terminal_endpoint_years = [2019]
post_hoc_fixed_county_window_start = 2012
post_hoc_fixed_county_window_end = 2018
post_hoc_fixed_county_inclusion_rule = "county_has_one_terminal_test_row_in_every_endpoint_year_2012_2018_without_using_outcome_values"
post_hoc_loss_metrics = ["rmse_difference", "mae_difference"]

predictive_fit_authorized = true
family_stacking_authorized = false
coefficient_export_authorized = false
row_prediction_export_authorized = false
row_loss_export_authorized = false
bootstrap_draw_export_authorized = false
refit_uncertainty_authorized = false
model_selection_uncertainty_authorized = false
population_uncertainty_authorized = false
causal_uncertainty_authorized = false
damage_uncertainty_authorized = false
scc_uncertainty_authorized = false
promotion_rule_revision_authorized = false
post_hoc_bootstrap_authorized = false
post_hoc_model_selection_authorized = false

