schema = "us_nclimgrid_estimator_spatial_sample_contract_v1"
role = "outcome_free_nine_county_weather_measurement_sensitivity_not_response_damage_or_scc"
year = 2019
month = 6
county_geoids = ["01001", "05001", "06019", "16019", "18113", "19003", "20111", "21001", "31039"]
selection_rule = "fixed geographically dispersed production-county sample selected from completed national polygon weights before nine-county comparison output"
minimum_unique_state_fips = 9
variables = ["PRCP", "TAVG", "TMIN", "TMAX"]

[inputs]
grid = "data/raw/us_county/nclimgrid_daily/ncdd-201906-grd-scaled.nc"
prcp = "data/raw/us_county/nclimgrid_county_averages/2019/prcp-201906-cty-scaled.csv"
tavg = "data/raw/us_county/nclimgrid_county_averages/2019/tavg-201906-cty-scaled.csv"
tmin = "data/raw/us_county/nclimgrid_county_averages/2019/tmin-201906-cty-scaled.csv"
tmax = "data/raw/us_county/nclimgrid_county_averages/2019/tmax-201906-cty-scaled.csv"
version = "data/raw/us_county/nclimgrid_county_averages/2019/ncdd-201906-version.txt"
state_crosswalk = "data/raw/us_county/nclimgrid_county_averages/us-state-codes_ncei-to-fips.csv"
weight_root = "data/interim/us_county/nclimgrid_polygon_weights_national_all_practice_v1"

[validation]
exact_county_order_required = true
complete_official_support_required = true
complete_daily_month_required = true
registered_polygon_weights_required = true
outcomes_read = false
estimator_equivalence_threshold_defined = false
registered_polygon_route_replaced = false
relationship_estimation_authorized = false
damage_or_scc_authorized = false
