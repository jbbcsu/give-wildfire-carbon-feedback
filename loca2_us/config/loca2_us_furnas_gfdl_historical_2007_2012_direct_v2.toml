schema = "loca2_us_historical_climate_sentinel/v1"
status = "frozen_before_third_county_direct_chunk_run"
created = "2026-10-13"
[source]
store = "mdmf/gdp/LOCA2/CMIP6-LOCA2.historical.daily.zarr"
endpoint_url = "https://usgs.osn.mghpcc.org/"
precipitation_version = "v20240915"
source_id = "GFDL-ESM4"
experiment_id = "historical"
variant_label = "r1i1p1f1"
variables = ["pr", "tasmin", "tasmax"]
selection_rule = "Retain the first prespecified model/member; do not select on Furnas climate skill or outcomes."
[sample]
county_geoid = "31065"
crop = "corn_grain"
year_min = 2007
year_max = 2012
season_start_month_day = "05-06"
season_end_month_day = "10-22"
wet_day_threshold_mm = 1.0
stage_fractions = [0.0, 0.3, 0.7, 1.0]
outcome_columns_read = false
paired_year_scoring = false
support_rule = "Second frozen nonoverlapping six-year partition for the outcome- and climate-value-blind maximin third county."
[inputs]
weights = "loca2_us/data/interim/weights/tiger2019/county_geoid=31065/weights.parquet"
weights_receipt = "loca2_us/data/provenance/loca2_furnas_tiger2019_weights_20261013.json"
nclimgrid_feature_pattern = "data/interim/us_county/nclimgrid_features_national_v1/harvest_year={year}/features.parquet"
[resources]
maximum_remote_chunk_mib = 1024
maximum_worker_mib = 512
one_worker = true
persist_remote_arrays = false
spatial_accumulator = "one_source_spatial_chunk_variable_serial_v2"
[outputs]
features = "loca2_us/data/interim/furnas_gfdl_historical_2007_2012_direct_v2_corn_features.parquet"
receipt = "loca2_us/data/provenance/loca2_furnas_gfdl_historical_climate_sentinel_2007_2012_direct_v2_20261013.json"
[claim_gates]
historical_climate_sentinel = false
multi_county_validation = false
outcome_response = false
causal_damage = false
SCC = false
