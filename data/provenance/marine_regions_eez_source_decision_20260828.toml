notes = "Selection fixes the candidate geometry/version before overlay results are inspected. On 2026-08-28 the official named GeoPackage request endpoints were resolved, but both return a registration form requiring name, organisation, email, country, user category, purpose, and explicit disclaimer acceptance rather than a downloadable object. On 2026-09-03 the official WFS capabilities and EEZ schema metadata were inspected without retrieving geometry. They identify the EEZ layer as v12 and expose the required polygon-type, territory, sovereign, ISO, and MultiSurface fields, but the capabilities document states that users should contact VLIZ before using a layer. The automation did not contact the provider, invent or submit personal data, accept terms, or acquire geometry. Acquisition therefore still needs authorized human terms acceptance or provider permission. Exact geometry bytes/checksum, topology, longitude handling, joint regimes, disputed claims, high-seas complement, and ISO3 reconciliation remain fail-closed gates."
