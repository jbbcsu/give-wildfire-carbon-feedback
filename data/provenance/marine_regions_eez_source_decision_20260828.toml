notes = "Selection fixes the candidate geometry/version before overlay results are inspected. On 2026-08-28 the official named GeoPackage request endpoints were resolved, but both return a registration form requiring name, organisation, email, country, user category, purpose, and explicit disclaimer acceptance rather than a downloadable object. The automation did not invent or submit personal data and did not accept terms. Acquisition therefore needs an authorized human submission or a provider-supplied non-personal access route. Exact object identity, bytes, checksum, fields, topology, longitude convention, joint regimes, disputed claims, high-seas complement, and ISO3 mapping remain fail-closed gates."
