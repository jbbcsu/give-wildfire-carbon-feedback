input_id = "nass_irrigation_practice_screen"
title = "USDA NASS county irrigation-practice yields and Census crop-area shares"
source = "USDA National Agricultural Statistics Service Quick Stats API"
status = "acquired_exact_series_and_fail_closed_coverage_audited"
