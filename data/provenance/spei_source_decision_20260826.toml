reviewed_inputs = [
  "config/continuous_global_panel_1982_2016_v1.toml",
  "data/interim/mirca_os_v2/irrigation_shares_2000.parquet",
  "data/interim/common_support/maize_1982_1989_direct_view.parquet",
  "data/interim/common_support/soy_1982_1989_direct_view.parquet",
]
method = "For each valid GGCMI calendar cell and regime, assign harvest year 1982 using the repository cross-year rule, subtract 90 days where applicable, then subtract five calendar months for SPEI-6. Intersect pre-1981 requirements with positive MIRCA regime share and the current early direct/scPDSI common-support keys."
primary_season_maize_common_rows_requiring_pre1981 = 16
primary_season_maize_observed_yield_rows_requiring_pre1981 = 15
primary_season_soy_common_rows_requiring_pre1981 = 0
preplant90_maize_common_rows_requiring_pre1981 = 444
preplant90_maize_observed_yield_rows_requiring_pre1981 = 82
preplant90_soy_common_rows_requiring_pre1981 = 29
preplant90_soy_observed_yield_rows_requiring_pre1981 = 9
decision = "No large download for the primary: apply the algorithmic antecedent-coverage rule and remove every affected key from every family through the exact master support intersection. Start the global preplant90 secondary in 1983; preserving its 1982 support would require a separately reviewed pre-1981 climate acquisition. Recompute the illustrative counts against the continuous-panel candidates and hash the resulting coverage receipt before construction."
